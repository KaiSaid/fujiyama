meta:
  environment: python
  toolchain:
    name: pip
    version: 3.10
build:
  requirementsPath: requirements.txt
run:
  persistenceMounts:
    - path: /data
      mountPath: /data
  # Замени 'fujiyama' на название папки, где лежит твой wsgi.py
  command: gunicorn fujiyama.wsgi:application --bind 0.0.0.0:80